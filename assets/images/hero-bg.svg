<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <text x="960" y="500" font-family="Georgia,serif" font-size="120" font-weight="bold" fill="rgba(255,255,255,0.05)" text-anchor="middle" font-style="italic">La Mif</text>
  <text x="960" y="600" font-family="Inter,sans-serif" font-size="24" fill="rgba(255,255,255,0.1)" text-anchor="middle">Restaurante Halal - Zaragoza</text>
</svg>
